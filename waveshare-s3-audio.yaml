substitutions:
  device_name: esp32-audio-s3
  friendly: "Waveshare Audio S3"

  # Phases of the Voice Assistant
  voice_assist_idle_phase_id: "1" # ready to be triggered by a wake word
  voice_assist_waiting_for_command_phase_id: "2" # waiting for a voice command (after being triggered by the wake word)
  voice_assist_listening_for_command_phase_id: "3" # listening for a voice command
  voice_assist_thinking_phase_id: "4" # processing the command
  voice_assist_replying_phase_id: "5" # replying to the command
  voice_assist_not_ready_phase_id: "10" # not ready
  voice_assist_error_phase_id: "11" #encountered an error

  i2s_mclk: GPIO12
  i2s_bclk: GPIO13 #SCLK
  i2s_lrclk: GPIO14 #LRCK/WS

  amp_ctrl: 8 #9 #Extended IO pin that controls the PA_EN on the TCA9555
  i2c_scl: GPIO10
  i2c_sda: GPIO11

  #mic lookup
  mic_channel_0: "left"
  mic_channel_1: "right" # mic wont allow right
  mic_channel_2: "stereo" # voice assistant does not support stereo

  #WORKING
  which_mic: 0 #0=left, 1=right, 2=stereo
  i2s_sample_rate: 16000 # Works as in sync with microphone (mic must have 16000 for voice assistant)
  i2s_mode_mic: secondary
  i2s_use_apll: true
  i2s_bps_spk: 16bit
  i2s_bps_mic: 16bit
  i2s_mclk_multiple: 256 # 128, 256, 384, 512

  hidden_ssid: "false"
  led_num: "7" # WS2812 ring leds
  # HA Fade effect: ms for one full cycle through all colors
  ha_fade_slow_period: "6000"
  ha_fade_fast_period: "2000"

esphome:
  name: $device_name
  friendly_name: $friendly
  name_add_mac_suffix: true
  min_version: 2025.8.0
  on_boot:
    - priority: 375
      then:
        - sensor.template.publish:
            id: next_timer
            state: -1
        - script.execute: control_leds
        - delay: 10min
        - if:
            condition:
              lambda: return id(init_in_progress);
            then:
              - lambda: id(init_in_progress) = false;
              - script.execute: control_leds
    - priority: -100
      then:
        # The ES8311 is I2S master for mic AND speaker but derives BCLK/LRCK from
        # MCLK, which the ESP only outputs while the speaker port runs. Start it
        # silently now (timeout: never keeps it on), otherwise the mic runs on bad
        # clocks until the first sound plays and wake word detection stalls.
        - lambda: |-
            id(i2s_audio_speaker)->set_audio_stream_info(audio::AudioStreamInfo(16, 2, ${i2s_sample_rate}));
            id(i2s_audio_speaker)->start();
        - pcf85063.read_time:
            id: rtc
        # Template numbers only restore their state, set_action does not run at boot
        - lambda: |-
            id(adc_mic).set_mic_gain(id(mic_gain_db).state);
            id(va_mic).set_gain_factor(id(va_gain_factor).state);
            id(va).set_noise_suppression_level(id(va_noise_suppression).state);

esp32:
  board: esp32-s3-devkitc-1
  cpu_frequency: 240MHz
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf
    version: recommended
    sdkconfig_options:
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"
      CONFIG_ESP32S3_INSTRUCTION_CACHE_32KB: "y"

      # Considerably speeds up mWW at the cost of using more PSRAM.
      CONFIG_SPIRAM_RODATA: "y"
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: "y"

      CONFIG_BT_ALLOCATION_FROM_SPIRAM_FIRST: "y"
      CONFIG_BT_BLE_DYNAMIC_ENV_MEMORY: "y"

      CONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC: "y"
      CONFIG_MBEDTLS_SSL_PROTO_TLS1_3: "y" # TLS1.3 support isn't enabled by default in IDF 5.1.5

wifi:
  id: wifi_id
  fast_connect: ${hidden_ssid}
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none # Disable power saving for better performance
  reboot_timeout: 10min # Prevent unnecessary reboots
  on_connect:
    - script.execute: control_leds
  on_disconnect:
    - script.execute: control_leds

logger:
  level: DEBUG

api:
  id: api_id
  actions:
    - action: start_va
      then:
        - voice_assistant.start
    - action: stop_va
      then:
        - voice_assistant.stop
  on_client_connected:
    - script.execute: control_leds
  on_client_disconnected:
    - script.execute: control_leds

  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    id: ota_esphome
    password: !secret ota_password

web_server:
  port: 80
  version: 3
  auth:
    username: !secret device_name_web_username
    password: !secret device_name_web_password

i2c:
  - id: internal_i2c
    sda: $i2c_sda
    scl: $i2c_scl
    scan: true
    frequency: 100kHz

# I/O Expander that controls the amplifier enable pin
tca9555:
  id: ioexp
  i2c_id: internal_i2c
  address: 0x20

psram:
  mode: octal
  speed: 80MHz

# Both sources set the same system clock: the RTC at boot, HA on every sync.
# id(rtc).now() is therefore valid as soon as either one has a time, so
# alarms keep working without HA.
time:
  - platform: pcf85063
    id: rtc
    i2c_id: internal_i2c
    address: 0x51
    update_interval: never # read once at boot, HA keeps it in sync after that
    on_time:
      - seconds: 0
        minutes: /1
        then:
          - script.execute: check_alarm
    on_time_sync:
      - script.execute: publish_current_time

  - platform: homeassistant
    id: ha_time
    on_time_sync:
      - pcf85063.write_time:
          id: rtc
      - script.execute: publish_current_time

light:
  - platform: esp32_rmt_led_strip
    id: status_ring
    name: "LED ring"
    pin: GPIO38
    num_leds: ${led_num}
    chipset: WS2812
    rgb_order: RGB
    default_transition_length: 150ms
    effects:
      - pulse:
          name: "Pulse Slow"
          min_brightness: 30%
          max_brightness: 100%
          transition_length: 2000ms
          update_interval: 2000ms
      - pulse:
          name: "Pulse Medium"
          min_brightness: 30%
          max_brightness: 100%
          transition_length: 600ms
          update_interval: 600ms
      - pulse:
          name: "Pulse Fast"
          min_brightness: 30%
          max_brightness: 100%
          transition_length: 300ms
          update_interval: 300ms
      - addressable_rainbow:
          name: "Rainbow Slow"
          speed: 6
          width: 7
      - addressable_color_wipe:
          name: "Wipe"
      - addressable_lambda:
          name: "HA Fade Slow"
          update_interval: 16ms
          lambda: |-
            // Whole ring fades through the Home Assistant blues
            static Color colors[4] = {Color(0x00, 0x6A, 0xC0), Color(0x03, 0xA9, 0xF4),
                                       Color(0x61, 0xC9, 0xFF), Color(0x97, 0xE8, 0xFF)};
            const float pos = (millis() % ${ha_fade_slow_period}) * 4.0f / ${ha_fade_slow_period};
            const int i = int(pos);
            it.all() = colors[i].gradient(colors[(i + 1) % 4], uint8_t((pos - i) * 255));
      - addressable_lambda:
          name: "HA Fade Fast"
          update_interval: 16ms
          lambda: |-
            // Whole ring fades through the Home Assistant blues
            static Color colors[4] = {Color(0x00, 0x6A, 0xC0), Color(0x03, 0xA9, 0xF4),
                                       Color(0x61, 0xC9, 0xFF), Color(0x97, 0xE8, 0xFF)};
            const float pos = (millis() % ${ha_fade_fast_period}) * 4.0f / ${ha_fade_fast_period};
            const int i = int(pos);
            it.all() = colors[i].gradient(colors[(i + 1) % 4], uint8_t((pos - i) * 255));
      - addressable_lambda:
          name: "Volume"
          update_interval: 16ms
          lambda: |-
            // round(volume x leds) LEDs in the current color, rest dark
            auto *mp = id(external_media_player);
            const int n = mp->is_muted() ? 0 : (int) roundf(mp->volume * it.size());
            for (int i = 0; i < it.size(); i++)
              it[i] = i < n ? current_color : Color::BLACK;
      - strobe:
          name: "Strobe"
          colors:
            - state: true
              brightness: 100%
              red: 60%
              green: 0%
              blue: 60%
              duration: 300ms
            - state: false
              duration: 300ms

i2s_audio:
  - id: i2s_output
    i2s_lrclk_pin:
      number: $i2s_lrclk
      allow_other_uses: true
    i2s_bclk_pin:
      number: $i2s_bclk
      allow_other_uses: true
    i2s_mclk_pin:
      number: $i2s_mclk

  - id: i2s_input
    i2s_lrclk_pin:
      number: $i2s_lrclk
      allow_other_uses: true
    i2s_bclk_pin:
      number: $i2s_bclk
      allow_other_uses: true

audio_adc:
  - platform: es7210
    id: adc_mic
    i2c_id: internal_i2c
    sample_rate: $i2s_sample_rate
    bits_per_sample: $i2s_bps_mic

# Patched ES8311 from this repo (see README for the git source)
external_components:
  - source:
      type: local
      path: components
    components: [es8311]

audio_dac:
  - platform: es8311
    id: es8311_dac
    i2c_id: internal_i2c
    use_mclk: true
    sample_rate: $i2s_sample_rate
    bits_per_sample: $i2s_bps_spk
    force_master: true
    mclk_multiple: $i2s_mclk_multiple

microphone:
  - platform: i2s_audio
    id: i2s_mics
    i2s_din_pin: GPIO15
    adc_type: external
    pdm: false
    i2s_audio_id: i2s_input
    i2s_mode: $i2s_mode_mic
    sample_rate: $i2s_sample_rate
    bits_per_sample: $i2s_bps_mic
    use_apll: $i2s_use_apll
    mclk_multiple: $i2s_mclk_multiple
    channel: ${mic_channel_${which_mic}}

speaker:
  - platform: i2s_audio
    id: i2s_audio_speaker
    i2s_dout_pin: GPIO16
    i2s_audio_id: i2s_output
    i2s_mode: secondary # the patched ES8311 is master
    dac_type: external
    timeout: never
    buffer_duration: 100ms
    audio_dac: es8311_dac
    sample_rate: $i2s_sample_rate
    bits_per_sample: $i2s_bps_spk
    use_apll: $i2s_use_apll
    mclk_multiple: $i2s_mclk_multiple
    channel: stereo

  # Virtual speakers to combine the announcement and media streams together into one output
  - platform: mixer
    id: mixing_speaker
    output_speaker: i2s_audio_speaker
    num_channels: 2
    source_speakers:
      - id: announcement_mixing_input
        timeout: never
      - id: media_mixing_input
        timeout: never

  # Vritual speakers to resample each pipelines' audio, if necessary, as the mixer speaker requires the same sample rate
  - platform: resampler
    id: announcement_resampling_speaker
    output_speaker: announcement_mixing_input
  - platform: resampler
    id: media_resampling_speaker
    output_speaker: media_mixing_input

media_player:
  - platform: speaker
    id: external_media_player
    name: None
    internal: False
    volume_increment: 0.05
    volume_min: 0.4
    volume_max: 0.8
    announcement_pipeline:
      speaker: announcement_resampling_speaker
      format: FLAC # FLAC is the least processor intensive codec
      num_channels: 1 # Stereo audio is unnecessary for announcements
      sample_rate: 48000 #Supported by Music Assistant
    media_pipeline:
      speaker: media_resampling_speaker
      format: FLAC # FLAC is the least processor intensive codec
      sample_rate: 48000
    on_announcement:
      - mixer_speaker.apply_ducking:
          id: media_mixing_input
          decibel_reduction: 20
          duration: 0.0s
    on_state:
      if:
        condition:
          and:
            - switch.is_off: timer_ringing
            - not:
                voice_assistant.is_running:
            - not:
                media_player.is_announcing:
        then:
          - mixer_speaker.apply_ducking:
              id: media_mixing_input
              decibel_reduction: 0
              duration: 1.0s
    on_mute:
      - delay: 100ms # Debounce
      - script.execute: control_leds_volume_changed
    on_unmute:
      - delay: 100ms # Debounce
      - script.execute: control_leds_volume_changed
    on_volume:
      if:
        condition:
          - lambda: return !id(init_in_progress);
        then:
          - delay: 100ms # Debounce
          - script.execute: control_leds_volume_changed
    files:
      - id: mute_switch_on_sound
        file: https://github.com/esphome/home-assistant-voice-pe/raw/dev/sounds/mute_switch_on.flac
      - id: mute_switch_off_sound
        file: https://github.com/esphome/home-assistant-voice-pe/raw/dev/sounds/mute_switch_off.flac
      - id: timer_finished_sound
        file: https://github.com/esphome/home-assistant-voice-pe/raw/dev/sounds/timer_finished.flac
      - id: wake_word_triggered_sound
        file: https://github.com/esphome/home-assistant-voice-pe/raw/dev/sounds/wake_word_triggered.flac
      - id: error_cloud_expired
        file: https://github.com/esphome/home-assistant-voice-pe/raw/dev/sounds/error_cloud_expired.mp3

voice_assistant:
  id: va
  microphone:
    id: va_mic
    microphone: i2s_mics
    channels: $which_mic
  media_player: external_media_player
  micro_wake_word: mww
  use_wake_word: false
  noise_suppression_level: 0 #2 #0
  auto_gain: 0 dbfs
  volume_multiplier: 1
  on_client_connected:
    - lambda: id(init_in_progress) = false;
    - if:
        condition:
          switch.is_off: mute
        then:
          - micro_wake_word.start:
    - lambda: id(voice_assistant_phase) = ${voice_assist_idle_phase_id};
    - script.execute: control_leds
  on_client_disconnected:
    - voice_assistant.stop:
    - lambda: id(voice_assistant_phase) = ${voice_assist_not_ready_phase_id};
    - script.execute: control_leds
  on_error:
    # Only set the error phase if the error code is different than duplicate_wake_up_detected or stt-no-text-recognized
    # These two are ignored for a better user experience
    - if:
        condition:
          and:
            - lambda: return !id(init_in_progress);
            - lambda: return code != "duplicate_wake_up_detected";
            - lambda: return code != "stt-no-text-recognized";
        then:
          - lambda: id(voice_assistant_phase) = ${voice_assist_error_phase_id};
          - script.execute: control_leds
    # If the error code is cloud-auth-failed, serve a local audio file guiding the user.
    - if:
        condition:
          - lambda: return code == "cloud-auth-failed";
        then:
          - script.execute:
              id: play_sound
              priority: true
              sound_file: !lambda return id(error_cloud_expired);
  # When the voice assistant starts: Play a wake up sound, duck audio.
  on_start:
    - mixer_speaker.apply_ducking:
        id: media_mixing_input
        decibel_reduction: 30 #20  # Number of dB quieter; higher implies more quiet, 0 implies full volume
        duration: 0.0s # The duration of the transition (default is no transition)
  on_listening:
    - lambda: id(voice_assistant_phase) = ${voice_assist_waiting_for_command_phase_id};
    - script.execute: control_leds
  on_stt_vad_start:
    - lambda: id(voice_assistant_phase) = ${voice_assist_listening_for_command_phase_id};
    - script.execute: control_leds
  on_stt_vad_end:
    - lambda: id(voice_assistant_phase) = ${voice_assist_thinking_phase_id};
    - script.execute: control_leds
  on_intent_progress:
    - if:
        condition:
          # A nonempty x variable means a streaming TTS url was sent to the media player
          lambda: "return !x.empty();"
        then:
          - lambda: id(voice_assistant_phase) = ${voice_assist_replying_phase_id};
          - script.execute: control_leds
          # Start a script that would potentially enable the stop word if the response is longer than a second
          - script.execute: activate_stop_word_once
  on_tts_start:
    - if:
        condition:
          # The intent_progress trigger didn't start the TTS Reponse
          lambda: "return id(voice_assistant_phase) != ${voice_assist_replying_phase_id};"
        then:
          - lambda: id(voice_assistant_phase) = ${voice_assist_replying_phase_id};
          - script.execute: control_leds
          # Start a script that would potentially enable the stop word if the response is longer than a second
          - script.execute: activate_stop_word_once
  on_tts_end:
    - script.execute:
        id: send_tts_uri_event
        tts_uri: !lambda "return x;"
  on_stt_end:
    - script.execute:
        id: send_stt_text_event
        stt_text: !lambda "return x;"

  # When the voice assistant ends ...
  on_end:
    - wait_until:
        not:
          voice_assistant.is_running:
    # Stop ducking audio.
    - mixer_speaker.apply_ducking:
        id: media_mixing_input
        decibel_reduction: 0
        duration: 1.0s
    # If the end happened because of an error, let the error phase on for a second
    - if:
        condition:
          lambda: return id(voice_assistant_phase) == ${voice_assist_error_phase_id};
        then:
          - delay: 1s
    # Reset the voice assistant phase id and reset the LED animations.
    - lambda: id(voice_assistant_phase) = ${voice_assist_idle_phase_id};
    - script.execute: control_leds
  on_timer_finished:
    - switch.turn_on: timer_ringing
    - lambda: |
        id(next_timer).publish_state(-1);
        id(next_timer_name).publish_state("-");
  on_timer_started:
    - script.execute: publish_next_timer
  on_timer_cancelled:
    - script.execute: publish_next_timer
  on_timer_updated:
    - script.execute: publish_next_timer
  on_timer_tick:
    - lambda: |
        id(fetch_first_active_timer).execute();
        int seconds_left = id(first_active_timer).seconds_left;
        if (seconds_left % 5 == 0) {
          id(next_timer).publish_state(seconds_left);
        }
        // LED updates are handled centrally by control_leds()

micro_wake_word:
  id: mww
  microphone:
    microphone: i2s_mics
    channels: $which_mic
  stop_after_detection: false
  models:
    - model: https://github.com/kahrendt/microWakeWord/releases/download/okay_nabu_20241226.3/okay_nabu.json
      id: okay_nabu
    - model: https://raw.githubusercontent.com/formatBCE/Respeaker-Lite-ESPHome-integration/refs/heads/main/microwakeword/models/v2/kenobi.json
      id: kenobi
    - model: hey_jarvis
      id: hey_jarvis
    - model: https://github.com/kahrendt/microWakeWord/releases/download/stop/stop.json
      id: stop
      internal: true
  vad:
    probability_cutoff: 0.03
  on_wake_word_detected:
    # If the wake word is detected when the device is muted (Possible with the software mute switch): Do nothing
    - if:
        condition:
          switch.is_off: mute
        then:
          # If a timer is ringing: Stop it, do not start the voice assistant (We can stop timer from voice!)
          - if:
              condition:
                switch.is_on: timer_ringing
              then:
                - switch.turn_off: timer_ringing
              # Stop voice assistant if running
              else:
                - if:
                    condition:
                      voice_assistant.is_running:
                    then:
                      voice_assistant.stop:
                    # Stop any other media player announcement
                    else:
                      - if:
                          condition:
                            media_player.is_announcing:
                          then:
                            - media_player.stop:
                                announcement: true
                          # Start the voice assistant and play the wake sound, if enabled
                          else:
                            - if:
                                condition:
                                  switch.is_on: wake_sound
                                then:
                                  - script.execute:
                                      id: play_sound
                                      priority: true
                                      sound_file: !lambda return id(wake_word_triggered_sound);
                                  - delay: 300ms
                            - voice_assistant.start:
                                wake_word: !lambda return wake_word;

globals:
  - id: init_in_progress
    type: bool
    restore_value: no
    initial_value: "true"
  - id: voice_assistant_phase
    type: int
    restore_value: no
    initial_value: ${voice_assist_not_ready_phase_id}
  - id: first_active_timer
    type: voice_assistant::Timer
    restore_value: no
  - id: is_timer_active
    type: bool
    restore_value: no

script:
  - id: flash_ring
    then:
      - script.execute:
          { id: led_set_effect, effect: "solid", r: 1.0, g: 0.0, b: 0.0 }
      - delay: 250ms
      - script.execute: control_leds

  - id: mute_feedback
    parameters:
      sound_file: "audio::AudioFile*"
    then:
      - if:
          condition:
            lambda: return !id(init_in_progress);
          then:
            - if:
                condition:
                  switch.is_on: mute_sound
                then:
                  - script.execute:
                      id: play_sound
                      priority: false
                      sound_file: !lambda return sound_file;
            - script.execute: flash_ring

  # Minimal dispatcher for LEDs: off / solid / built-in effects
  - id: led_set_effect
    mode: restart
    parameters:
      effect: std::string
      r: float
      g: float
      b: float
    then:
      - lambda: |-
          ESP_LOGD("led", "led_set_effect: effect='%s' rgb(%.2f, %.2f, %.2f) brightness=%.2f",
                   effect.c_str(), r, g, b, (float) id(led_ring_brightness).state);
      - if:
          condition:
            lambda: 'return effect == "off" || !id(led_ring_enabled).state;'
          then:
            - light.turn_off: status_ring
          else:
            - light.turn_on:
                id: status_ring
                brightness: !lambda "return id(led_ring_brightness).state;"
                red: !lambda "return r;"
                green: !lambda "return g;"
                blue: !lambda "return b;"
                effect: !lambda 'return effect == "solid" ? std::string("None") : effect;'

  # Single LED state machine (small footprint)
  - id: control_leds
    mode: single
    then:
      - lambda: |-
          const bool wifi_connected = id(wifi_id).is_connected();
          const bool api_connected  = id(api_id).is_connected();
          const bool ringing        = id(timer_ringing).state;
          const bool init_progress  = id(init_in_progress);
          const int  phase          = id(voice_assistant_phase);

          // Refresh timer cache sparsely when needed
          id(check_if_timers_active).execute();
          const bool timers_active = id(is_timer_active);

          ESP_LOGD("led",
                   "control_leds: wifi=%d api=%d init=%d ringing=%d timers_active=%d phase=%d",
                   (int)wifi_connected, (int)api_connected, (int)init_progress,
                   (int)ringing, (int)timers_active, phase);

          auto set = [&](const char* effect, float r, float g, float b) {
            id(led_set_effect).execute(effect, r, g, b);
          };

          if (init_progress) {                       // Boot/init
            if (wifi_connected) set("Rainbow Slow", 0.9, 0.1, 0.85); else set("Rainbow Slow", 1.0, 0.1, 0.1);
            return;
          }
          if (!wifi_connected || !api_connected) {   // HA disconnected
            set("Pulse Medium", 1.0, 0.0, 0.0);
            return;
          }
          if (ringing) {                             // Alarm/timer ringing
            set("Strobe", 0.6, 0.0, 0.6);
            return;
          }

          // Voice assistant phases
          switch (phase) {
            case ${voice_assist_waiting_for_command_phase_id}: // wake word detected
              set("solid", 0.012, 0.663, 0.957);  // #03A9F4
              return;
            case ${voice_assist_listening_for_command_phase_id}:
              set("HA Fade Slow", 0, 0, 0);
              return;
            case ${voice_assist_thinking_phase_id}:
              set("HA Fade Fast", 0, 0, 0);
              return;
            case ${voice_assist_replying_phase_id}:
              set("HA Fade Slow", 0, 0, 0);
              return;
            case ${voice_assist_error_phase_id}:
              set("Pulse Fast", 1.0, 0.0, 0.0);
              return;
            case ${voice_assist_not_ready_phase_id}:
              set("Pulse Slow", 1.0, 0.0, 0.0);
              return;
            default: break;
          }

          // Timers ticking (no bar, minimal footprint)
          if (timers_active) {
            set("Pulse Slow", 0.6, 0.0, 0.6);
            return;
          }

          // Idle
          set("off", 0, 0, 0);

  # Show volume as green LEDs, then restore
  - id: control_leds_volume_changed
    mode: restart
    then:
      - script.execute:
          { id: led_set_effect, effect: "Volume", r: 0.0, g: 1.0, b: 0.0 }
      - delay: 1.2s
      - script.execute: control_leds

  # Timer sound handling
  - id: ring_timer
    then:
      - script.execute: enable_repeat_one
      - script.execute:
          id: play_sound
          priority: true
          sound_file: !lambda return id(timer_finished_sound);

  - id: enable_repeat_one
    then:
      - lambda: |-
          id(external_media_player)
            ->make_call()
            .set_command(media_player::MediaPlayerCommand::MEDIA_PLAYER_COMMAND_REPEAT_ONE)
            .set_announcement(true)
            .perform();
          id(external_media_player)->set_playlist_delay_ms(speaker::AudioPipelineType::ANNOUNCEMENT, 500);

  - id: disable_repeat
    then:
      - lambda: |-
          id(external_media_player)
            ->make_call()
            .set_command(media_player::MediaPlayerCommand::MEDIA_PLAYER_COMMAND_REPEAT_OFF)
            .set_announcement(true)
            .perform();
          id(external_media_player)->set_playlist_delay_ms(speaker::AudioPipelineType::ANNOUNCEMENT, 0);

  - id: play_sound
    parameters:
      priority: bool
      sound_file: "audio::AudioFile*"
    then:
      - lambda: |-
          if (priority) {
            id(external_media_player)
              ->make_call()
              .set_command(media_player::MediaPlayerCommand::MEDIA_PLAYER_COMMAND_STOP)
              .set_announcement(true)
              .perform();
          }
          if ((id(external_media_player).state != media_player::MediaPlayerState::MEDIA_PLAYER_STATE_ANNOUNCING) || priority) {
            id(external_media_player)->play_file(sound_file, true, false);
          }

  # Timer helpers
  - id: publish_next_timer
    then:
      - lambda: |-
          id(check_if_timers_active).execute();
          if (id(is_timer_active)) {
            id(fetch_first_active_timer).execute();
            id(next_timer).publish_state(id(first_active_timer).seconds_left);
            id(next_timer_name).publish_state(id(first_active_timer).name);
          } else {
            id(next_timer).publish_state(-1);
            id(next_timer_name).publish_state("-");
          }
      - script.execute: control_leds

  - id: fetch_first_active_timer
    mode: single
    then:
      - lambda: |
          static uint32_t last_fetch_time = 0;
          uint32_t now = millis();
          if (now - last_fetch_time < 500) return;
          last_fetch_time = now;

          const auto &timers = id(va).get_timers();
          if (timers.empty()) return;

          auto output_timer = *timers.begin();
          for (const auto &timer : timers) {
            if (timer.is_active && timer.seconds_left <= output_timer.seconds_left) {
              output_timer = timer;
            }
          }
          id(first_active_timer) = output_timer;

  - id: check_if_timers_active
    then:
      - lambda: |
          const auto &timers = id(va).get_timers();
          bool output = false;
          if (!timers.empty()) {
            for (const auto &timer : timers) {
              if (timer.is_active) {
                output = true;
                break;
              }
            }
          }
          id(is_timer_active) = output;

  # Enable/disable the "stop" wake word around long TTS
  - id: activate_stop_word_once
    then:
      - delay: 1s
      - if:
          condition:
            switch.is_off: timer_ringing
          then:
            - micro_wake_word.enable_model: stop
            - wait_until:
                not:
                  media_player.is_announcing:
            - if:
                condition:
                  switch.is_off: timer_ringing
                then:
                  - micro_wake_word.disable_model: stop

  # Alarm handling + time publishing
  - id: check_alarm
    then:
      - lambda: |-
          id(publish_current_time).execute();
          if (id(alarm_on).state) {
            auto set_alarm_time = id(alarm_time).state;
            if (set_alarm_time.length() == 5 &&
                isdigit(set_alarm_time[0]) && isdigit(set_alarm_time[1]) &&
                isdigit(set_alarm_time[3]) && isdigit(set_alarm_time[4])) {
              auto alarm_hour = std::stoi(set_alarm_time.substr(0, 2));
              auto alarm_minute = std::stoi(set_alarm_time.substr(3, 2));
              auto time_now = id(rtc).now();
              if (time_now.hour == alarm_hour && time_now.minute == alarm_minute) {
                auto action = id(alarm_action).current_option();
                if (action == "Play sound") {
                  id(timer_ringing).turn_on();
                } else if (action == "Send event") {
                  id(send_alarm_event).execute();
                } else if (action == "Sound and event") {
                  id(timer_ringing).turn_on();
                  id(send_alarm_event).execute();
                }
              }
            } else {
              ESP_LOGW("alarm", "Incorrect alarm time setting");
            }
          }

  - id: send_alarm_event
    then:
      - homeassistant.event:
          event: esphome.alarm_ringing

  - id: send_tts_uri_event
    parameters:
      tts_uri: string
    then:
      - homeassistant.event:
          event: esphome.tts_uri
          data:
            uri: !lambda return tts_uri;

  - id: send_stt_text_event
    parameters:
      stt_text: string
    then:
      - homeassistant.event:
          event: esphome.stt_text
          data:
            text: !lambda return stt_text;

  - id: publish_current_time
    mode: single
    then:
      - lambda: |-
          static std::string last_time_string = "";
          auto time_now = id(rtc).now();
          std::string current_time_string = time_now.strftime("%H:%M");
          if (current_time_string != last_time_string) {
            id(current_time).publish_state(current_time_string);
            last_time_string = current_time_string;
          }

select:
  - platform: template
    name: "Wake word sensitivity"
    optimistic: true
    initial_option: Slightly sensitive
    restore_value: true
    entity_category: config
    options:
      - Slightly sensitive
      - Moderately sensitive
      - Very sensitive
    on_value:
      # Sets specific wake word probabilities computed for each particular model
      # Note probability cutoffs are set as a quantized uint8 value, each comment has the corresponding floating point cutoff
      # False Accepts per Hour values are tested against all units and channels from the Dinner Party Corpus.
      # These cutoffs apply only to the specific models included in the firmware: okay_nabu@20241226.3, hey_jarvis@v2, hey_mycroft@v2
      lambda: |-
        if (x == "Slightly sensitive") {
          id(okay_nabu).set_probability_cutoff(217);    // 0.85 -> 0.000 FAPH on DipCo (Manifest's default)
          //id(hey_jarvis).set_probability_cutoff(247);   // 0.97 -> 0.563 FAPH on DipCo (Manifest's default)
          //id(hey_mycroft).set_probability_cutoff(253);  // 0.99 -> 0.567 FAPH on DipCo
        } else if (x == "Moderately sensitive") {
          id(okay_nabu).set_probability_cutoff(176);    // 0.69 -> 0.376 FAPH on DipCo
          //id(hey_jarvis).set_probability_cutoff(235);   // 0.92 -> 0.939 FAPH on DipCo
          //id(hey_mycroft).set_probability_cutoff(242);  // 0.95 -> 1.502 FAPH on DipCo (Manifest's default)
        } else if (x == "Very sensitive") {
          id(okay_nabu).set_probability_cutoff(50);
          //id(okay_nabu).set_probability_cutoff(143);    // 0.56 -> 0.751 FAPH on DipCo
          //id(hey_jarvis).set_probability_cutoff(212);   // 0.83 -> 1.502 FAPH on DipCo
          //id(hey_mycroft).set_probability_cutoff(237);  // 0.93 -> 1.878 FAPH on DipCo
        }
  - platform: logger
    id: logger_select
    name: "Logger level"
    entity_category: diagnostic
    disabled_by_default: true
  - platform: template
    optimistic: true
    restore_value: true
    name: "Alarm action"
    entity_category: config
    id: alarm_action
    icon: mdi:bell-plus
    options:
      - "Play sound"
      - "Send event"
      - "Sound and event"
    initial_option: "Play sound"

switch:
  - platform: gpio
    id: amp_enable_8
    name: "Amplifier"
    icon: mdi:speaker
    entity_category: config
    pin:
      tca9555: ioexp
      number: $amp_ctrl
      inverted: false
    restore_mode: RESTORE_DEFAULT_ON

  # Mute = no wake word, no voice assistant. Restored across reboots.
  - platform: template
    id: mute
    name: "Mute"
    icon: mdi:microphone-off
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      - micro_wake_word.stop:
      - voice_assistant.stop:
      - script.execute:
          id: mute_feedback
          sound_file: !lambda return id(mute_switch_on_sound);
    on_turn_off:
      - micro_wake_word.start:
      - script.execute:
          id: mute_feedback
          sound_file: !lambda return id(mute_switch_off_sound);

  - platform: template
    id: mute_sound
    name: "Mute toggle sound"
    icon: "mdi:bullhorn"
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON

  - platform: template
    id: led_ring_enabled
    name: "LED ring enabled"
    icon: mdi:led-on
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    on_turn_on:
      - script.execute: control_leds
    on_turn_off:
      - script.execute: control_leds

  - platform: template
    id: wake_sound
    name: "Wake sound"
    icon: "mdi:bullhorn"
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON

  - platform: template
    id: timer_ringing
    optimistic: true
    internal: true
    restore_mode: ALWAYS_OFF
    on_turn_off:
      - micro_wake_word.disable_model: stop
      - script.execute: disable_repeat
      - if:
          condition:
            media_player.is_announcing:
          then:
            media_player.stop:
              announcement: true
      - mixer_speaker.apply_ducking:
          id: media_mixing_input
          decibel_reduction: 0
          duration: 1.0s
      - script.execute: control_leds
    on_turn_on:
      - mixer_speaker.apply_ducking:
          id: media_mixing_input
          decibel_reduction: 20
          duration: 0.0s
      - micro_wake_word.enable_model: stop
      - script.execute: ring_timer
      - script.execute: control_leds
      - delay: 15min
      - switch.turn_off: timer_ringing

  - platform: template
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    id: alarm_on
    icon: mdi:bell-badge
    name: "Alarm"
    on_turn_on:
      - script.execute: control_leds
    on_turn_off:
      - script.execute: control_leds

number:
  - platform: template
    id: mic_gain_db
    name: "Mic gain"
    entity_category: config
    optimistic: true
    min_value: 0
    max_value: 42
    step: 1
    restore_value: true
    initial_value: 24
    set_action:
      - lambda: |-
          id(adc_mic).set_mic_gain(x);   // adjust PGA on the fly
      - logger.log:
          format: "[MIC] Set ES7210 gain to %.0f dB"
          args: ["x"]

  - platform: template
    id: va_gain_factor
    name: "Mic gain factor"
    entity_category: config
    optimistic: true
    min_value: 1
    max_value: 64
    step: 1
    restore_value: true
    initial_value: 32
    set_action:
      - lambda: |-
          id(va_mic).set_gain_factor(x);   // adjust gain factor on the fly
      - logger.log:
          format: "[MIC] Set gain factor to %.0f"
          args: ["x"]

  - platform: template
    id: va_noise_suppression
    name: "Noise suppression"
    entity_category: config
    optimistic: true
    min_value: 0
    max_value: 4
    step: 1
    restore_value: true
    initial_value: 4
    set_action:
      - lambda: |-
          id(va).set_noise_suppression_level(x);   // adjust noise suppression on the fly
      - logger.log:
          format: "[MIC] Set suppression to %.0f"
          args: ["x"]

  - platform: template
    id: led_ring_brightness
    name: "LED brightness"
    icon: mdi:brightness-6
    entity_category: config
    optimistic: true
    restore_value: true
    min_value: 0.4
    max_value: 1.0
    step: 0.05
    initial_value: 0.8
    mode: slider
    on_value:
      - if:
          condition:
            light.is_on: status_ring
          then:
            - light.turn_on:
                id: status_ring
                brightness: !lambda "return x;"

sensor:
  - platform: template
    id: next_timer
    name: "Next timer"
    update_interval: never
    disabled_by_default: true
    device_class: duration
    unit_of_measurement: s
    icon: "mdi:timer"
    accuracy_decimals: 0

text:
  - platform: template
    id: alarm_time
    name: "Alarm time"
    icon: mdi:bell-ring
    mode: text
    optimistic: true
    restore_value: true
    initial_value: "07:00"
    min_length: 5
    max_length: 5
    pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$" # HH:MM, enforced by the HA frontend

text_sensor:
  - platform: template
    id: next_timer_name
    name: "Next timer name"
    icon: "mdi:timer"
    disabled_by_default: true
  - platform: template
    name: "Device time"
    entity_category: diagnostic
    id: current_time
    icon: mdi:clock

button:
  - platform: factory_reset
    id: factory_reset_button
    name: "Factory reset"
    entity_category: diagnostic
    internal: true
  - platform: restart
    id: restart_button
    name: "Restart"
    entity_category: config
    disabled_by_default: true
    icon: "mdi:restart"

binary_sensor:
  - platform: gpio
    id: key1_button
    name: "Key 1"
    internal: true
    pin:
      tca9555: ioexp
      number: 9 # not '12' as schematics say!
      inverted: true
    # click = volume down, hold = repeat every 200 ms
    on_press:
      - media_player.volume_down: external_media_player
      - delay: 500ms
      - while:
          condition:
            binary_sensor.is_on: key1_button
          then:
            - media_player.volume_down: external_media_player
            - delay: 200ms

  - platform: gpio
    id: key2_button
    name: "Key 2"
    internal: true
    pin:
      tca9555: ioexp
      number: 10
      inverted: true
    on_multi_click:
      # double click = toggle mute
      - timing:
          - ON for at most 400ms
          - OFF for at most 300ms
          - ON for at most 400ms
          - OFF for at least 50ms
        then:
          - switch.toggle: mute
      # click = stop ringing alarm/timer, else play/pause
      - timing:
          - ON for at most 400ms
          - OFF for at least 300ms
        then:
          - if:
              condition:
                switch.is_on: timer_ringing
              then:
                - switch.turn_off: timer_ringing
              else:
                - media_player.toggle: external_media_player

  - platform: gpio
    id: key3_button
    name: "Key 3"
    internal: true
    pin:
      tca9555: ioexp
      number: 11
      inverted: true
    # click = volume up, hold = repeat every 200 ms
    on_press:
      - media_player.volume_up: external_media_player
      - delay: 500ms
      - while:
          condition:
            binary_sensor.is_on: key3_button
          then:
            - media_player.volume_up: external_media_player
            - delay: 200ms
